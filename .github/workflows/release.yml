name: Build & Release

on:
  push:
    tags: ['v*']                   # 推送 v0.2.9 这类 tag 自动触发
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag（例如 v0.2.9，需已存在）"
        required: true

permissions:
  contents: write                   # 创建 Release 必需

jobs:
  # ════════════════════════════════════════════════
  # Job 0: Lint & Import Check（构建前置检查）
  #         在所有构建之前运行，失败则跳过后续耗时 job
  # ════════════════════════════════════════════════
  check:
    name: Lint & Import Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: latest
          python-version: "3.14"
          enable-cache: true
          cache-suffix: "uv-check"

      - name: Sync dev dependencies
        run: uv sync --group dev

      - name: Lint check (ruff)
        run: uv run ruff check app/ main.py build.py

      - name: Syntax check
        run: |
          uv run python -c "import ast; ast.parse(open('main.py').read()); print('check: syntax OK')"

      - name: Core import check
        run: |
          # 只导入 app.core 包，验证模块结构可加载；不触发 PyQt5 懒加载（Linux+Py3.14 下 PyQt5 会段错误）
          uv run python -c "import app.core; print('check: imports OK')"

      - name: Check build.py cleanup list for QtPositioning
        run: |
          uv run python3 -c 'import sys; lines=open("build.py").readlines(); [sys.exit(print("ERROR: Line "+str(i)+": QtPositioning.framework in cleanup list")) for i,l in enumerate(lines,1) if "QtPositioning.framework" in l.strip() and not l.strip().startswith("#")]; print("OK: QtPositioning.framework not in cleanup list")'

  # ════════════════════════════════════════════════
  # Job 1: Windows (PyInstaller + Inno Setup)
  # ════════════════════════════════════════════════
  build-windows:
    needs: [check]
    name: Windows (PyInstaller + Inno Setup)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: latest
          python-version: "3.14"
          enable-cache: true
          cache-suffix: "uv-win"

      - name: Sync dependencies
        run: uv sync --all-groups

      # ── 解析版本号 + 分支后缀 ──
      # suffix 用法：dev 分支发布 → -qt5（PyQt5 版）；pyside6 分支发布 → -pyside6
      # 用 scripts/sync_tag.sh 同时在两分支打同一 tag，产物名靠 suffix 区分
      - name: Resolve version & suffix
        id: version
        shell: bash
        run: |
          v="${{ inputs.tag || github.ref_name }}"
          echo "tag=$v" >> "$GITHUB_OUTPUT"
          branch="${{ github.ref_name }}"
          case "$branch" in
            dev)              suffix="qt5"     ;;
            pyside6)          suffix="pyside6" ;;
            *)                suffix="dev"     ;;  # 兜底：未识别分支用 dev
          esac
          echo "suffix=$suffix" >> "$GITHUB_OUTPUT"
          echo "💡 Version: $v | Branch: $branch | Suffix: -$suffix"

      # ── PyInstaller ──
      - name: PyInstaller build
        run: uv run python build.py

      - name: Verify PyInstaller output
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/Drifox/Drifox.exe")) {
            Write-Error "❌ PyInstaller 没有产出 dist/Drifox/Drifox.exe"
            exit 1
          }
          Write-Host "✅ PyInstaller 打包成功"

      # ── Inno Setup ──
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress --limit-output

      - name: Compile installer
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $suffix = "${{ steps.version.outputs.suffix }}"
          Write-Host "💡 编译安装包，版本号: $tag-$suffix"
          & "C:\Program Files (x86)\Inno Setup 6\iscc.exe" dist\installer.iss /DMyAppVersion=$tag /DMyAppSuffix=$suffix
          if ($LASTEXITCODE -ne 0) {
            Write-Error "❌ Inno Setup 编译失败 (exit code: $LASTEXITCODE)"
            exit 1
          }

      - name: Verify installer output
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $suffix = "${{ steps.version.outputs.suffix }}"
          $installer = "dist/output/Drifox-Windows-Setup-$tag-$suffix.exe"
          if (-not (Test-Path $installer)) {
            Write-Error "❌ 安装包未生成: $installer"
            exit 1
          }
          Write-Host "✅ 安装包: $((Get-Item $installer).Length / 1MB) MB"

      # ── 校验和 ──
      - name: Generate SHA256
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $suffix = "${{ steps.version.outputs.suffix }}"
          $installer = "dist/output/Drifox-Windows-Setup-$tag-$suffix.exe"
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "dist/output/SHA256SUMS" -Value "$hash  Drifox-Windows-Setup-$tag-$suffix.exe"
          Write-Host "✅ SHA256: $hash"

      - name: Upload artifact (Windows)
        uses: actions/upload-artifact@v4
        with:
          name: Drifox-Windows-${{ steps.version.outputs.tag }}-${{ steps.version.outputs.suffix }}
          path: |
            dist/output/*
          if-no-files-found: error
          retention-days: 30

  # ════════════════════════════════════════════════
  # Job 2: macOS (PyInstaller + DMG)
  # ════════════════════════════════════════════════
  build-macos:
    name: macOS (PyInstaller + DMG)
    needs: [check]
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: latest
          python-version: "3.14"
          enable-cache: true
          cache-suffix: "uv-mac"

      - name: Sync dependencies (build + mac-build)
        run: uv sync --group build --group mac-build

      # ── 解析版本号 + 分支后缀 ──
      - name: Resolve version & suffix
        id: version
        shell: bash
        run: |
          v="${{ inputs.tag || github.ref_name }}"
          echo "tag=$v" >> "$GITHUB_OUTPUT"
          branch="${{ github.ref_name }}"
          case "$branch" in
            dev)              suffix="qt5"     ;;
            pyside6)          suffix="pyside6" ;;
            *)                suffix="dev"     ;;
          esac
          echo "suffix=$suffix" >> "$GITHUB_OUTPUT"
          echo "💡 Version: $v | Branch: $branch | Suffix: -$suffix"

      # ── PyInstaller ──
      - name: PyInstaller build
        run: uv run python build.py
        env:
          PYINSTALLER_ARCH: arm64

      - name: Verify PyInstaller output
        shell: bash
        run: |
          APP="dist/Drifox.app"
          FRAMEWORKS="$APP/Contents/Frameworks"

          if [ ! -d "$APP" ]; then
            echo "❌ PyInstaller 没有产出 dist/Drifox.app"
            exit 1
          fi
          echo "✅ PyInstaller 打包成功"

          # ── 依赖完整性检查 ──
          echo ""
          echo "📦 依赖完整性检查..."

          # QtPositioning —— QtWebEngineWidgets 必需
          if [ -L "$FRAMEWORKS/QtPositioning" ] && [ -f "$(readlink -f "$FRAMEWORKS/QtPositioning" 2>/dev/null || echo "")" ]; then
            echo "  ✅ QtPositioning (符号链接有效)"
          elif [ -f "$FRAMEWORKS/QtPositioning" ]; then
            echo "  ✅ QtPositioning (文件存在)"
          else
            echo "  ❌ QtPositioning 缺失或断链"
            ls -la "$FRAMEWORKS/QtPositioning" 2>/dev/null || true
            echo ""
            echo "⚠️  请检查 build.py 的 to_remove_macos 列表是否误删了 QtPositioning.framework"
            exit 1
          fi

          # QtPositioningQuick
          if [ -f "$FRAMEWORKS/QtPositioningQuick" ]; then
            echo "  ✅ QtPositioningQuick"
          else
            echo "  ⚠️  QtPositioningQuick 未找到（可选依赖）"
          fi

          # 关键 Qt5 framework（Core / Gui / Widgets / WebEngine）
          # 打包后结构：Frameworks/QtCore -> PyQt5/Qt5/lib/QtCore.framework/Versions/5/QtCore
          for fw in QtCore QtGui QtWidgets QtWebEngineCore; do
            target="$FRAMEWORKS/$fw"
            if [ -f "$target" ]; then
              echo "  ✅ $fw (文件存在)"
            elif [ -L "$target" ]; then
              # 符号链接，解析相对路径检查目标
              link_target=$(readlink "$target")
              real_target="$FRAMEWORKS/$link_target"
              if [ -f "$real_target" ]; then
                echo "  ✅ $fw (符号链接有效 -> $link_target)"
              else
                echo "  ❌ $fw 符号链接断链: $link_target"
                exit 1
              fi
            else
              echo "  ❌ $fw 缺失"
              exit 1
            fi
          done

          echo ""
          echo "✅ 依赖完整性检查通过"

      # ── 代码签名说明 ──
      # 不做 ad-hoc 签名。原因：
      #   1. ad-hoc 签名本身不提供开发者身份认证，无法消除 Gatekeeper 弹窗
      #   2. codesign --deep 已被 Apple 弃用，可能导致内部签名不一致
      #   3. 本地打包也从不做签名，工作正常
      #   4. 下载的 .app 因 quarantine 属性 + 问题签名会触发更严格的检查，
      #      反而不如不签名（未签名 app 只需在"隐私与安全性"中点"仍要打开"一次）

      # ── DMG ──
      - name: Build DMG
        run: uv run python create_dmg.py
        env:
          DMG_VERSION: ${{ steps.version.outputs.tag }}
          DMG_SUFFIX: ${{ steps.version.outputs.suffix }}

      - name: Verify DMG output
        shell: bash
        run: |
          tag="${{ steps.version.outputs.tag }}"
          suffix="${{ steps.version.outputs.suffix }}"
          dmg="dist/Drifox-macOS-${tag}-${suffix}.dmg"
          if [ ! -f "$dmg" ]; then
            echo "❌ DMG 未生成: $dmg"
            exit 1
          fi
          echo "✅ DMG: $(du -h "$dmg" | cut -f1)"

      # ── 校验和 ──
      - name: Generate SHA256
        shell: bash
        run: |
          tag="${{ steps.version.outputs.tag }}"
          suffix="${{ steps.version.outputs.suffix }}"
          sha256sum "dist/Drifox-macOS-${tag}-${suffix}.dmg" | tee dist/SHA256SUMS

      # ── 上传产物 ──
      - name: Upload artifact (macOS)
        uses: actions/upload-artifact@v4
        with:
          name: Drifox-macOS-${{ steps.version.outputs.tag }}-${{ steps.version.outputs.suffix }}
          path: |
            dist/Drifox-macOS-*.dmg
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  # ════════════════════════════════════════════════
  # Job 3: Linux (PyInstaller + tar.gz)
  # ════════════════════════════════════════════════
  build-linux:
    name: Linux (PyInstaller + tar.gz)
    needs: [check]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: latest
          python-version: "3.14"
          enable-cache: true
          cache-suffix: "uv-linux"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libxcb-xinerama0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xfixes0 libxcb-xkb1 \
            libxkbcommon-x11-0 libegl1

      - name: Sync dependencies
        run: uv sync --group linux-build

      # ── 解析版本号 + 分支后缀 ──
      - name: Resolve version & suffix
        id: version
        shell: bash
        run: |
          v="${{ inputs.tag || github.ref_name }}"
          echo "tag=$v" >> "$GITHUB_OUTPUT"
          branch="${{ github.ref_name }}"
          case "$branch" in
            dev)              suffix="qt5"     ;;
            pyside6)          suffix="pyside6" ;;
            *)                suffix="dev"     ;;
          esac
          echo "suffix=$suffix" >> "$GITHUB_OUTPUT"
          echo "💡 Version: $v | Branch: $branch | Suffix: -$suffix"

      # ── PyInstaller ──
      - name: PyInstaller build
        run: uv run python build.py

      - name: Verify PyInstaller output
        shell: bash
        run: |
          if [ ! -f "dist/Drifox/Drifox" ]; then
            echo "❌ PyInstaller 没有产出 dist/Drifox/Drifox"
            exit 1
          fi
          echo "✅ PyInstaller 打包成功"

      # ── 打包 tar.gz ──
      - name: Package as tar.gz
        shell: bash
        run: |
          cd dist
          tag="${{ steps.version.outputs.tag }}"
          suffix="${{ steps.version.outputs.suffix }}"
          tar czf "Drifox-Linux-${tag}-${suffix}.tar.gz" Drifox/
          echo "✅ tar.gz: $(du -h Drifox-Linux-${tag}-${suffix}.tar.gz | cut -f1)"

      - name: Verify tar.gz output
        shell: bash
        run: |
          tag="${{ steps.version.outputs.tag }}"
          suffix="${{ steps.version.outputs.suffix }}"
          if [ ! -f "dist/Drifox-Linux-${tag}-${suffix}.tar.gz" ]; then
            echo "❌ tar.gz 未生成: dist/Drifox-Linux-${tag}-${suffix}.tar.gz"
            exit 1
          fi

      # ── 校验和 ──
      - name: Generate SHA256
        shell: bash
        run: |
          tag="${{ steps.version.outputs.tag }}"
          suffix="${{ steps.version.outputs.suffix }}"
          cd dist
          sha256sum "Drifox-Linux-${tag}-${suffix}.tar.gz" | tee SHA256SUMS

      # ── 上传产物 ──
      - name: Upload artifact (Linux)
        uses: actions/upload-artifact@v4
        with:
          name: Drifox-Linux-${{ steps.version.outputs.tag }}-${{ steps.version.outputs.suffix }}
          path: |
            dist/Drifox-Linux-*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  # ════════════════════════════════════════════════
  # Job 4: 发布 GitHub Release（仅 push tag 时触发）
  # ════════════════════════════════════════════════
  release:
    name: Publish GitHub Release
    if: github.event_name == 'push'
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts (flat dir)
        shell: bash
        run: |
          mkdir -p release-assets
          # 收集各平台安装包
          find artifacts -type f \
            \( -name "*.exe" -o -name "*.dmg" -o -name "*.tar.gz" \) \
            -exec cp {} release-assets/ \;
          # 合并所有平台 SHA256SUMS（避免平台间相互覆盖）
          find artifacts -type f -name "SHA256SUMS" -exec cat {} \; \
            > release-assets/SHA256SUMS
          ls -la release-assets/

      - name: Extract changelog for release body
        shell: bash
        run: |
          python -c "
          import re, sys
          with open('CHANGELOG.md') as f:
              content = f.read()
          tag = '${{ github.ref_name }}'
          # Extract the version entry matching current tag (## [vX.Y.Z] ...)
          tag_escaped = re.escape(tag)
          match = re.search(rf'## \[{tag_escaped}\].*?(?=\n## |\Z)', content, re.DOTALL)
          if match:
              body = match.group().strip()
              with open('release_body.txt', 'w') as f:
                  f.write(body)
              print(f'Release body extracted from CHANGELOG.md (tag: {tag})')
          else:
              print(f'WARNING: no version entry found in CHANGELOG.md for tag {tag}, using empty body')
              open('release_body.txt', 'w').close()
          "

      - name: Annotate suffix in release body
        shell: bash
        run: |
          # 如果不是默认 dev 后缀，给 body 加一行标记便于用户区分两种构建
          suffix="${{ steps.version.outputs.suffix }}"
          if [ "$suffix" != "dev" ]; then
            echo "" >> release_body.txt
            echo "---" >> release_body.txt
            echo "" >> release_body.txt
            echo "**构建版本**: \`$suffix\` （分支: \`${{ github.ref_name }}\`）" >> release_body.txt
          fi

      - name: Create / Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "DriFox ${{ github.ref_name }}"
          body_path: release_body.txt
          draft: false
          prerelease: >-
            ${{
              contains(github.ref_name, 'rc') ||
              contains(github.ref_name, 'beta') ||
              contains(github.ref_name, 'alpha') ||
              contains(github.ref_name, 'test')
            }}
          generate_release_notes: false
          files: |
            release-assets/Drifox-Windows-Setup-*.exe
            release-assets/Drifox-macOS-*.dmg
            release-assets/Drifox-Linux-*.tar.gz
            release-assets/SHA256SUMS
