name: Build & Release

on:
  push:
    tags: ['v*']                   # 推送 v0.2.9 这类 tag 自动触发
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag（例如 v0.2.9，需已存在）"
        required: true

permissions:
  contents: write                   # 创建 Release 必需

jobs:
  # ════════════════════════════════════════════════
  # Job 0: Lint & Import Check（构建前置检查）
  #         在所有构建之前运行，失败则跳过后续耗时 job
  # ════════════════════════════════════════════════
  check:
    name: Lint & Import Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: latest
          python-version: "3.14"
          enable-cache: true
          cache-suffix: "uv-check"

      - name: Sync dev dependencies
        run: uv sync --group dev

      - name: Lint check (ruff)
        run: uv run ruff check app/ main.py build.py

      - name: Syntax check
        run: |
          uv run python -c "import ast; ast.parse(open('main.py').read()); print('check: syntax OK')"

      - name: Core import check
        run: |
          # 只导入 app.core 包，验证模块结构可加载；不触发 PyQt5 懒加载（Linux+Py3.14 下 PyQt5 会段错误）
          uv run python -c "import app.core; print('check: imports OK')"

  # ════════════════════════════════════════════════
  # Job 1: Windows (PyInstaller + Inno Setup)
  # ════════════════════════════════════════════════
  build-windows:
    needs: [check]
    name: Windows (PyInstaller + Inno Setup)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: latest
          python-version: "3.14"
          enable-cache: true
          cache-suffix: "uv-win"

      - name: Sync dependencies
        run: uv sync --all-groups

      # ── 解析版本号 ──
      - name: Resolve version
        id: version
        shell: bash
        run: |
          v="${{ inputs.tag || github.ref_name }}"
          echo "tag=$v" >> "$GITHUB_OUTPUT"
          echo "💡 Version: $v"

      # ── PyInstaller ──
      - name: PyInstaller build
        run: uv run python build.py

      - name: Verify PyInstaller output
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/Drifox/Drifox.exe")) {
            Write-Error "❌ PyInstaller 没有产出 dist/Drifox/Drifox.exe"
            exit 1
          }
          Write-Host "✅ PyInstaller 打包成功"

      # ── Inno Setup ──
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress --limit-output

      - name: Compile installer
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          Write-Host "💡 编译安装包，版本号: $tag"
          & "C:\Program Files (x86)\Inno Setup 6\iscc.exe" dist\installer.iss /DMyAppVersion=$tag
          if ($LASTEXITCODE -ne 0) {
            Write-Error "❌ Inno Setup 编译失败 (exit code: $LASTEXITCODE)"
            exit 1
          }

      - name: Verify installer output
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $installer = "dist/output/Drifox-Setup-$tag.exe"
          if (-not (Test-Path $installer)) {
            Write-Error "❌ 安装包未生成: $installer"
            exit 1
          }
          Write-Host "✅ 安装包: $((Get-Item $installer).Length / 1MB) MB"

      # ── 校验和 ──
      - name: Generate SHA256
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $installer = "dist/output/Drifox-Setup-$tag.exe"
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "dist/output/SHA256SUMS" -Value "$hash  Drifox-Setup-$tag.exe"
          Write-Host "✅ SHA256: $hash"

      - name: Upload artifact (Windows)
        uses: actions/upload-artifact@v4
        with:
          name: Drifox-Windows-${{ steps.version.outputs.tag }}
          path: dist/output/*
          if-no-files-found: error
          retention-days: 30

  # ════════════════════════════════════════════════
  # Job 2: macOS (PyInstaller + DMG)
  # ════════════════════════════════════════════════
  build-macos:
    name: macOS (PyInstaller + DMG)
    needs: [check]
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: latest
          python-version: "3.14"
          enable-cache: true
          cache-suffix: "uv-mac"

      - name: Sync dependencies (build + mac-build)
        run: uv sync --group build --group mac-build

      # ── 解析版本号 ──
      - name: Resolve version
        id: version
        shell: bash
        run: |
          v="${{ inputs.tag || github.ref_name }}"
          echo "tag=$v" >> "$GITHUB_OUTPUT"
          echo "💡 Version: $v"

      # ── PyInstaller ──
      - name: PyInstaller build
        run: uv run python build.py
        env:
          PYINSTALLER_ARCH: arm64

      - name: Verify PyInstaller output
        shell: bash
        run: |
          if [ ! -d "dist/Drifox.app" ]; then
            echo "❌ PyInstaller 没有产出 dist/Drifox.app"
            exit 1
          fi
          echo "✅ PyInstaller 打包成功"

      # ── DMG ──
      - name: Build DMG
        run: uv run python create_dmg.py
        env:
          DMG_VERSION: ${{ steps.version.outputs.tag }}

      - name: Verify DMG output
        shell: bash
        run: |
          tag="${{ steps.version.outputs.tag }}"
          dmg="dist/Drifox-${tag}.dmg"
          if [ ! -f "$dmg" ]; then
            echo "❌ DMG 未生成: $dmg"
            exit 1
          fi
          echo "✅ DMG: $(du -h "$dmg" | cut -f1)"

      # ── 校验和 ──
      - name: Generate SHA256
        shell: bash
        run: |
          tag="${{ steps.version.outputs.tag }}"
          sha256sum "dist/Drifox-${tag}.dmg" | tee dist/SHA256SUMS

      # ── 上传产物 ──
      - name: Upload artifact (macOS)
        uses: actions/upload-artifact@v4
        with:
          name: Drifox-macOS-${{ steps.version.outputs.tag }}
          path: |
            dist/Drifox-*.dmg
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  # ════════════════════════════════════════════════
  # Job 3: Linux (PyInstaller + tar.gz)
  # ════════════════════════════════════════════════
  build-linux:
    name: Linux (PyInstaller + tar.gz)
    needs: [check]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: latest
          python-version: "3.14"
          enable-cache: true
          cache-suffix: "uv-linux"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libxcb-xinerama0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xfixes0 libxcb-xkb1 \
            libxkbcommon-x11-0 libegl1

      - name: Sync dependencies
        run: uv sync --group linux-build

      # ── 解析版本号 ──
      - name: Resolve version
        id: version
        shell: bash
        run: |
          v="${{ inputs.tag || github.ref_name }}"
          echo "tag=$v" >> "$GITHUB_OUTPUT"
          echo "💡 Version: $v"

      # ── PyInstaller ──
      - name: PyInstaller build
        run: uv run python build.py

      - name: Verify PyInstaller output
        shell: bash
        run: |
          if [ ! -f "dist/Drifox/Drifox" ]; then
            echo "❌ PyInstaller 没有产出 dist/Drifox/Drifox"
            exit 1
          fi
          echo "✅ PyInstaller 打包成功"

      # ── 打包 tar.gz ──
      - name: Package as tar.gz
        shell: bash
        run: |
          cd dist
          tag="${{ steps.version.outputs.tag }}"
          tar czf "Drifox-Linux-${tag}.tar.gz" Drifox/
          echo "✅ tar.gz: $(du -h Drifox-Linux-${tag}.tar.gz | cut -f1)"

      - name: Verify tar.gz output
        shell: bash
        run: |
          tag="${{ steps.version.outputs.tag }}"
          if [ ! -f "dist/Drifox-Linux-${tag}.tar.gz" ]; then
            echo "❌ tar.gz 未生成: dist/Drifox-Linux-${tag}.tar.gz"
            exit 1
          fi

      # ── 校验和 ──
      - name: Generate SHA256
        shell: bash
        run: |
          tag="${{ steps.version.outputs.tag }}"
          cd dist
          sha256sum "Drifox-Linux-${tag}.tar.gz" | tee SHA256SUMS

      # ── 上传产物 ──
      - name: Upload artifact (Linux)
        uses: actions/upload-artifact@v4
        with:
          name: Drifox-Linux-${{ steps.version.outputs.tag }}
          path: |
            dist/Drifox-Linux-*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  # ════════════════════════════════════════════════
  # Job 4: 发布 GitHub Release（仅 push tag 时触发）
  # ════════════════════════════════════════════════
  release:
    name: Publish GitHub Release
    if: github.event_name == 'push'
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts (flat dir)
        shell: bash
        run: |
          mkdir -p release-assets
          # 收集各平台安装包
          find artifacts -type f \
            \( -name "*.exe" -o -name "*.dmg" -o -name "*.tar.gz" \) \
            -exec cp {} release-assets/ \;
          # 合并所有平台 SHA256SUMS（避免平台间相互覆盖）
          find artifacts -type f -name "SHA256SUMS" -exec cat {} \; \
            > release-assets/SHA256SUMS
          ls -la release-assets/

      - name: Extract changelog for release body
        shell: bash
        run: |
          python -c "
          import re, sys
          with open('CHANGELOG.md') as f:
              content = f.read()
          # Extract the first version entry (from ## to next ## or EOF)
          match = re.search(r'## .*?(?=\n## |\Z)', content, re.DOTALL)
          if match:
              body = match.group().strip()
              with open('release_body.txt', 'w') as f:
                  f.write(body)
              print('Release body extracted from CHANGELOG.md')
          else:
              print('WARNING: no version entry found in CHANGELOG.md, using empty body')
              open('release_body.txt', 'w').close()
          "

      - name: Create / Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "DriFox ${{ github.ref_name }}"
          body_path: release_body.txt
          draft: false
          prerelease: >-
            ${{
              contains(github.ref_name, 'rc') ||
              contains(github.ref_name, 'beta') ||
              contains(github.ref_name, 'alpha') ||
              contains(github.ref_name, 'test')
            }}
          generate_release_notes: false
          files: |
            release-assets/Drifox-Setup-*.exe
            release-assets/Drifox-*.dmg
            release-assets/Drifox-Linux-*.tar.gz
            release-assets/SHA256SUMS
