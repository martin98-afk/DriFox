[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drifox-cli"
version = "0.2.12"
description = "DriFox 飘狐 — 轻量化 AI 桌面对话助手 CLI 版"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [
    {name = "98-afk", email = "98-afk@drifox.com"}
]
keywords = ["ai", "cli", "chat", "llm", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Utilities",
]

dependencies = [
    "PyQt5>=5.15.0,<5.15.16",
    "PyQtWebEngine>=5.15.0,<5.15.7",
    "PyQt-Fluent-Widgets",
    "qtpy>=2.0.0",
    "loguru>=0.7.0",
    "openai>=1.0.0",
    "httpx>=0.25.0",
    "html2text>=2020.1.16",
    "beautifulsoup4>=4.12.0",
    "PyYAML>=6.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "markdown",
    "pygments",
    "requests",
    "orjson>=3.8.0",
    # 桌面自动化 (pynput + mss)
    "pynput>=1.7.6",
    "mss>=9.0.1",
    # MCP (Model Context Protocol)
    "mcp>=1.0.0",
    # 插件热更新
    "psutil",
    "watchfiles>=1.0.0",
    "aiohttp",
    # LSP 集成
    "pygls>=2.0.0",
    "lsprotocol",
    # 中文历史记录的拼音首字母搜索
    "pypinyin>=0.49.0",
]

[project.optional-dependencies]
gateway = [
    "dingtalk-stream>=0.20",
    "python-telegram-bot>=20.0",
    "discord.py>=2.0",
    "slack-sdk>=3.0",
    "lark-oapi>=1.0",
    "aiohttp>=3.9.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
drifox = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*", "plugins*"]

[tool.setuptools.package-data]
"app" = ["py.typed"]
"plugins" = ["**/*"]

# uv 多平台依赖解析配置
[tool.uv]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]
