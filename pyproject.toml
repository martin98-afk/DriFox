[project]
name = "drifox"
version = "0.7.7"
description = "DriFox - AI Chat Desktop Application"
readme = "README.md"
requires-python = ">=3.14"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "98-afk", email = "98-afk@drifox.com"}
]
keywords = ["ai", "chat", "llm", "desktop", "pyqt5"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Chat",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# 核心运行时依赖
dependencies = [
    "PyQt5>=5.15.0,<5.15.16",
    "PyQtWebEngine>=5.15.0,<5.15.7",
    "PyQt-Fluent-Widgets",
    "loguru>=0.7.0",
    "openai>=1.0.0",
    "httpx>=0.25.0",
    "html2text>=2020.1.16",
    "beautifulsoup4>=4.12.0",
    "PyYAML>=6.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "psutil",
    "markdown",
    "pygments",
    "requests",
    # TLS 信任系统证书链（企业网/代理自签 CA 场景，见 app/utils/tls_trust.py）
    "truststore>=0.9.0",
    "orjson>=3.8.0",
    "pypinyin",
    # 全局热键
    "keyboard>=0.13.5",
    # MCP (Model Context Protocol)
    "mcp>=1.0.0",
    # 插件热更新
    "watchfiles>=1.0.0",
    # LSP 集成 (Language Server Protocol)
    "pygls>=2.0.0",
    "lsprotocol",
    # Windows 平台上 pyqt5-qt5 / pyqtwebengine-qt5 仅 5.15.2 提供 win_amd64 wheel
    "pyqt5-qt5>=5.15.2,<5.15.3; sys_platform == 'win32'",
    "pyqtwebengine-qt5>=5.15.2,<5.15.3; sys_platform == 'win32'",
    "pywinpty>=3.0.5 ; sys_platform == 'win32'",
    "keyring>=25.0.0",
    # keyring 的 Windows 凭证库后端（WinVaultKeyring）需要 win32cred。keyring 会优先
    # 尝试 pywin32-ctypes，但其 cffi 实现在部分环境损坏且异常类型绕过 ImportError
    # 回退，直接提供 pywin32 走回退分支最稳
    "pywin32>=306 ; sys_platform == 'win32'",
    "windows-toasts>=1.4,<2; sys_platform == 'win32'",
]

# 依赖组（供 uv sync --group / --all-groups 使用）
# 注意：CI 中 Windows：uv sync --all-groups，macOS：uv sync --group build --group mac-build，Linux：uv sync --group linux-build
[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-qt>=4.4.0",
    "pytest-timeout>=2.3.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pympler>=1.1",
]
build = [
    "pyinstaller>=6.16.0",
]
mac-build = [
    "pyinstaller>=6.16.0",
    "dmgbuild",
    "Pillow",
]
linux-build = [
    "pyinstaller>=6.16.0",
]
gateway = [
    # 平台 SDK 已 vendor 到社区插件 drifox-plugins2/plugins/gateway-*/deps/，主程序不携带
]
all = [
    {include-group = "dev"},
    {include-group = "build"},
    {include-group = "mac-build"},
    {include-group = "linux-build"},
    {include-group = "gateway"},
]

# ruff 配置
[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "F"]  # 基本语法、未定义名称
# 当前代码库遗留问题较多，临时全部 E/F 规则 ignore，后续在专门 PR 中清理
# (F821 大多为误报：from __future__ import annotations + 条件导入 + 闭包变量)
ignore = [
    "E501",  # 行长检查已由 formatter 处理
    "E402",  # 模块导入不在文件顶部
    "E701",  # 单行多语句（冒号）
    "E702",  # 单行多语句（分号）
    "E731",  # lambda 赋值
    "E741",  # 模糊变量名（如 l、I、O）
    "F401",  # 未使用 import
    "F403",  # import * 后使用未定义本地变量
    "F405",  # import * 后使用未定义本地变量
    "F811",  # 重新定义时未使用
    "F821",  # 未定义名称（误报：条件导入/闭包变量，详见 commit 注释）
    "F841",  # 未使用变量
]

[tool.ruff.format]
quote-style = "double"

# pytest 配置
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
# tests/ui 为 A 档全链 UI 测试（构建完整主窗口，重）：默认收集排除，
# 显式 `pytest tests/ui -m ui` 才运行（S3b）
#
# tests/perf 不再整体排除：预算门（test_startup_budget / test_memory_budget）
# 必须在默认收集里，否则「改慢无人报警」的护栏等于不存在。
# 仍逐个排除的是**已知不可用**的文件，各自原因见行尾注释：
#   - test_ui_memory_baseline.py   合跑 segfault（Qt 动画驱动 + 单槽回调）
#   - test_recycle_efficacy.py     首例即 Abort trap: 6（Qt 事件泵）
#   - test_stream_render_bench_web.py  Abort in QApplication 创建期
#   - test_stream_render_bench.py / test_stream_stage_bench.py
#                                  单跑 ≥50s / ≥85s，纯基线采集，无绝对阈值
#   - test_new_tab_baseline.py     真起窗口 25 轮，耗时分钟级
#   - long_run/                    ≥30s/场景长跑
# 需要人工跑这些文件时显式传路径即可（--ignore 只影响默认收集）。
addopts = "--ignore=tests/ui --ignore=tests/perf/test_ui_memory_baseline.py --ignore=tests/perf/test_recycle_efficacy.py --ignore=tests/perf/test_stream_render_bench_web.py --ignore=tests/perf/test_stream_render_bench.py --ignore=tests/perf/test_stream_stage_bench.py --ignore=tests/perf/test_new_tab_baseline.py --ignore=tests/perf/long_run"
xfail_strict = true
# 卡死兜底：单用例超 300s 即 fail 并打 Python 栈（thread 法，Windows 可用）。
# 无此项时任何死锁（waitSignal 等不到信号 / QEventLoop 不退出）会永久挂起，
# 无人值守 CI 上表现为无限等待。
timeout = 300
timeout_method = "thread"
markers = [
    "perf: 性能基准测试（测量响应时间）",
    "perf_long: 长时间运行时压测（≥30s/场景，需 QApplication）",
    "stress: 压力测试（连续调用验证稳定性）",
    "ui: A 档全链 UI 测试（完整主窗口 + WebEngine，需显式 pytest tests/ui -m ui）",
]

# 构建系统配置
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

# 打包配置
[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

# uv 多平台依赖解析配置
# 声明项目需要支持的目标平台，确保 uv lock 生成的锁文件兼容所有平台
[tool.uv]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

# 打包为单文件应用 (Windows)
[tool.pyinstaller.name]
onefile = true
console = false
name = "Drifox"
