# DriFox 巫师3风格主题 - Witcher Wild Hunt
# 灵感来源：The Witcher 3: Wild Hunt 游戏配色
# 主色调：暗红 + 金色 + 深黑

meta:
  name: "狂猎之夜"
  id: "witcher"
  author: "DriFox AI Designer"
  version: "1.0.0"

window:
  gradient_start: "rgba(20, 10, 8, 255)"
  gradient_end: "rgba(35, 18, 12, 255)"

background:
  chat_list:
    image: ""
    opacity: 0.15
    enabled: false

colors:
  # ===== 基础色 =====
  accent: "#c41e3a"                    # 巫师红 - 核心强调色
  accent_warm: "#d4a017"                # 金色 - 暖色强调
  border: "#4a3030"                    # 深红边框
  border_accent: "#8b3a3a"             # 带红的边框
  text_primary: "#f0ebe6"              # 羊皮纸白
  text_secondary: "rgba(240, 235, 230, 0.75)"
  text_muted: "#8a7f7a"                # 暗灰文字
  card_bg: "rgba(45, 25, 20, 230)"     # 暗红卡片
  card_bg_solid: "rgba(55, 30, 25, 250)"
  content_bg: "#1f1512"                # 深褐背景
  hover_bg: "rgba(196, 30, 58, 0.12)"  # 红色悬停
  selected_bg: "rgba(196, 30, 58, 0.32)"
  capsule_bg: "rgba(196, 30, 58, 180)"
  capsule_border: "rgba(196, 30, 58, 200)"

  # ===== 用户 / AI 卡片色 =====
  user_card_bg: "rgba(25, 35, 50, 150)"       # 冷蓝色调 - 用户
  user_card_accent: "#4a6fa5"                 # 蓝色强调
  user_card_text: "#e8e4df"                   # 暖白
  user_card_muted: "rgba(232, 228, 223, 0.6)"
  assistant_card_bg: "rgba(50, 30, 20, 150)"  # 暖橙色调 - AI
  assistant_card_accent: "#d4a017"             # 金色强调
  assistant_card_text: "#f5f0e8"               # 暖白
  assistant_card_muted: "rgba(245, 240, 232, 0.6)"

  # ===== 智能体按钮 =====
  agent_btn_text: "#a09080"
  agent_btn_text_active: "#d4a017"
  agent_btn_bg_active: "rgba(212, 160, 23, 0.2)"
  agent_btn_separator: "rgba(139, 58, 58, 150)"

  # ===== 输入框 =====
  input_bg_start: "rgba(30, 20, 15, 150)"
  input_bg_end: "rgba(40, 25, 20, 150)"
  input_focus_bg_start: "rgba(45, 30, 25, 220)"
  input_focus_bg_end: "rgba(55, 35, 28, 220)"
  input_text: "#d4cdc4"
  input_focus_text: "#f0ebe6"
  input_border: "#4a3535"
  input_focus_border: "#c41e3a"
  input_placeholder: "rgba(160, 144, 128, 0.4)"

  # ===== 实时交互卡片 =====
  realtime_border: "#8b3a3a"
  realtime_accent: "#c41e3a"
  realtime_accent_warm: "#d4a017"
  realtime_success: "#5a8a5a"
  realtime_error: "#c44a4a"
  realtime_bg: "rgba(45, 30, 25, 242)"
  realtime_text: "#e8dcd4"
  realtime_text_secondary: "rgba(232, 220, 212, 0.7)"
  realtime_tag_bg: "rgba(196, 30, 58, 0.15)"
  realtime_tag_border: "rgba(196, 30, 58, 0.3)"

  # ===== 系统卡片 =====
  system_border: "#6a4a3a"
  system_accent: "#b8860b"

  # ===== 发送按钮渐变 =====
  send_btn_start: "#8b1a1a"
  send_btn_end: "#c41e3a"
  send_btn_hover_start: "#a32828"
  send_btn_hover_end: "#d43050"

  # ===== 时间线 =====
  timeline_node: "#5a4a40"
  timeline_node_hover: "#c41e3a"
  timeline_node_visible: "#6a9a6a"
  timeline_node_selected: "#d4a017"
  timeline_line: "#3a2a25"
  timeline_line_progress: "#6a9a6a"

  # ===== 上下文圆环 =====
  ring_normal: "#c41e3a"
  ring_warning: "#d4a017"
  ring_danger: "#c44a4a"
  ring_compacted: "#7a5a8a"

  # ===== 分支标签 =====
  branch_label_bg: "rgba(196, 30, 58, 0.15)"
  branch_label_border: "rgba(196, 30, 58, 0.3)"
  window_bg: "rgba(20, 10, 8, 0.04)"