<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Network Graph</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body,#graph{width:100%;height:100vh;overflow:hidden;background:#0f0f1a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
.tooltip-btn{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1e1e3a;color:#aaa;border:1px solid #2a2a4e;padding:8px 20px;border-radius:20px;font-size:13px;cursor:pointer;z-index:100;transition:all .2s;user-select:none}
.tooltip-btn:hover{background:#2a2a4e;color:#fff;border-color:#6366f1}
</style>
</head>
<body>
<div id="graph"></div>
<div class="tooltip-btn" id="tipBtn">拖拽节点 · 滚轮缩放</div>
<script>
var chart = echarts.init(document.getElementById('graph'), 'dark');

var nodes = [
  { id: 'core',      name: '核心',       category: 0, symbolSize: 70, itemStyle: { color: '#6366f1' } },
  { id: 'frontend',  name: '前端',       category: 1, symbolSize: 55, itemStyle: { color: '#22d3ee' } },
  { id: 'backend',   name: '后端',       category: 1, symbolSize: 55, itemStyle: { color: '#34d399' } },
  { id: 'database',  name: '数据库',     category: 1, symbolSize: 50, itemStyle: { color: '#fbbf24' } },
  { id: 'devops',    name: '运维',       category: 1, symbolSize: 50, itemStyle: { color: '#f472b6' } },
  { id: 'react',     name: 'React',      category: 2, symbolSize: 40, itemStyle: { color: '#60a5fa' } },
  { id: 'vue',       name: 'Vue',        category: 2, symbolSize: 38, itemStyle: { color: '#4ade80' } },
  { id: 'webpack',   name: 'Webpack',    category: 2, symbolSize: 35, itemStyle: { color: '#8b5cf6' } },
  { id: 'node',      name: 'Node.js',    category: 2, symbolSize: 42, itemStyle: { color: '#84cc16' } },
  { id: 'python',    name: 'Python',     category: 2, symbolSize: 42, itemStyle: { color: '#facc15' } },
  { id: 'go',        name: 'Go',         category: 2, symbolSize: 38, itemStyle: { color: '#38bdf8' } },
  { id: 'mysql',     name: 'MySQL',      category: 2, symbolSize: 36, itemStyle: { color: '#fb923c' } },
  { id: 'redis',     name: 'Redis',      category: 2, symbolSize: 36, itemStyle: { color: '#ef4444' } },
  { id: 'docker',    name: 'Docker',     category: 2, symbolSize: 40, itemStyle: { color: '#3b82f6' } },
  { id: 'k8s',       name: 'K8s',        category: 2, symbolSize: 40, itemStyle: { color: '#a78bfa' } },
  { id: 'ci',        name: 'CI/CD',      category: 2, symbolSize: 32, itemStyle: { color: '#f9a8d4' } },
  { id: 'nginx',     name: 'Nginx',      category: 2, symbolSize: 30, itemStyle: { color: '#22c55e' } },
  { id: 'graphql',   name: 'GraphQL',    category: 2, symbolSize: 34, itemStyle: { color: '#e879f9' } },
  { id: 'grpc',      name: 'gRPC',       category: 2, symbolSize: 32, itemStyle: { color: '#f87171' } },
  { id: 'mq',        name: '消息队列',   category: 2, symbolSize: 34, itemStyle: { color: '#fbbf24' } },
];

var edges = [
  { source: 'core', target: 'frontend', lineStyle: { color: '#6366f1', width: 3, opacity: 0.7 } },
  { source: 'core', target: 'backend',  lineStyle: { color: '#6366f1', width: 3, opacity: 0.7 } },
  { source: 'core', target: 'database', lineStyle: { color: '#6366f1', width: 2.5, opacity: 0.6 } },
  { source: 'core', target: 'devops',   lineStyle: { color: '#6366f1', width: 2.5, opacity: 0.6 } },
  { source: 'frontend', target: 'react',   lineStyle: { color: '#22d3ee', width: 2, opacity: 0.5 } },
  { source: 'frontend', target: 'vue',     lineStyle: { color: '#22d3ee', width: 2, opacity: 0.5 } },
  { source: 'frontend', target: 'webpack', lineStyle: { color: '#22d3ee', width: 1.5, opacity: 0.4 } },
  { source: 'backend', target: 'node',   lineStyle: { color: '#34d399', width: 2, opacity: 0.5 } },
  { source: 'backend', target: 'python', lineStyle: { color: '#34d399', width: 2, opacity: 0.5 } },
  { source: 'backend', target: 'go',     lineStyle: { color: '#34d399', width: 2, opacity: 0.5 } },
  { source: 'backend', target: 'graphql',lineStyle: { color: '#34d399', width: 1.5, opacity: 0.4 } },
  { source: 'backend', target: 'grpc',   lineStyle: { color: '#34d399', width: 1.5, opacity: 0.4 } },
  { source: 'backend', target: 'mq',     lineStyle: { color: '#34d399', width: 1.5, opacity: 0.4 } },
  { source: 'database', target: 'mysql', lineStyle: { color: '#fbbf24', width: 2, opacity: 0.5 } },
  { source: 'database', target: 'redis', lineStyle: { color: '#fbbf24', width: 2, opacity: 0.5 } },
  { source: 'devops', target: 'docker', lineStyle: { color: '#f472b6', width: 2, opacity: 0.5 } },
  { source: 'devops', target: 'k8s',    lineStyle: { color: '#f472b6', width: 2, opacity: 0.5 } },
  { source: 'devops', target: 'ci',     lineStyle: { color: '#f472b6', width: 1.5, opacity: 0.4 } },
  { source: 'devops', target: 'nginx',  lineStyle: { color: '#f472b6', width: 1.5, opacity: 0.4 } },
  { source: 'node', target: 'react',    lineStyle: { color: '#555', width: 1, opacity: 0.3, type: 'dashed' } },
  { source: 'node', target: 'webpack',  lineStyle: { color: '#555', width: 1, opacity: 0.3, type: 'dashed' } },
  { source: 'python', target: 'docker', lineStyle: { color: '#555', width: 1, opacity: 0.3, type: 'dashed' } },
  { source: 'docker', target: 'k8s',    lineStyle: { color: '#555', width: 1, opacity: 0.3, type: 'dashed' } },
  { source: 'nginx', target: 'go',      lineStyle: { color: '#555', width: 1, opacity: 0.3, type: 'dashed' } },
  { source: 'nginx', target: 'python',  lineStyle: { color: '#555', width: 1, opacity: 0.3, type: 'dashed' } },
];

var categories = [
  { name: '架构分层', itemStyle: { color: '#6366f1' } },
  { name: '技术领域', itemStyle: { color: '#22d3ee' } },
  { name: '具体技术', itemStyle: { color: '#60a5fa' } },
];

var option = {
  backgroundColor: '#0f0f1a',
  title: {
    text: '技术架构全景图',
    subtext: '节点图网络 · Force Layout',
    left: 'center',
    top: 16,
    textStyle: { color: '#e0e0e0', fontSize: 20, fontWeight: 600 },
    subtextStyle: { color: '#666', fontSize: 12 },
  },
  tooltip: {
    trigger: 'item',
    formatter: function (params) {
      if (params.dataType === 'node') {
        return '<strong>' + params.name + '</strong><br/>类别: ' + categories[params.data.category].name;
      }
      return params.data.source + ' → ' + params.data.target;
    },
    backgroundColor: '#1e1e3a',
    borderColor: '#2a2a4e',
    textStyle: { color: '#e0e0e0' },
  },
  legend: {
    data: categories.map(function (c) { return c.name; }),
    top: 60,
    textStyle: { color: '#999' },
  },
  animationDuration: 1500,
  animationEasingUpdate: 'quinticInOut',
  series: [{
    type: 'graph',
    layout: 'force',
    force: {
      repulsion: 500,
      edgeLength: [120, 300],
      friction: 0.1,
      gravity: 0.08,
      layoutAnimation: true,
    },
    roam: true,
    draggable: true,
    data: nodes,
    edges: edges,
    categories: categories,
    focusNodeAdjacency: true,
    edgeSymbol: ['none', 'arrow'],
    edgeSymbolSize: [0, 6],
    label: {
      show: true,
      position: 'bottom',
      color: '#ccc',
      fontSize: 11,
      fontWeight: 500,
      offset: [0, 4],
    },
    lineStyle: {
      color: 'source',
      curveness: 0.2,
      opacity: 0.5,
    },
    emphasis: {
      focus: 'adjacency',
      lineStyle: {
        width: 3,
        opacity: 0.8,
      },
    },
    itemStyle: {
      borderColor: '#fff',
      borderWidth: 1,
      shadowBlur: 8,
      shadowColor: 'rgba(0,0,0,0.3)',
    },
  }],
};

chart.setOption(option);

window.addEventListener('resize', function () { chart.resize(); });

document.getElementById('tipBtn').addEventListener('mouseenter', function () {
  this.textContent = '鼠标悬停节点高亮关联关系';
});
document.getElementById('tipBtn').addEventListener('mouseleave', function () {
  this.textContent = '拖拽节点 · 滚轮缩放';
});
</script>
</body>
</html>
