<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  运行中图标 - 3 层同心环不规则呼吸
  19 个圆点（外 12 + 中 6 + 中心 1），5 种呼吸节奏 + 错时 delay
  在任何现代浏览器中打开即播放
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <style>
    .a { animation: pulse-a 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .b { animation: pulse-b 2.0s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .c { animation: pulse-c 2.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .d { animation: pulse-d 1.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .e { animation: pulse-e 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse-a { 0%,100% { opacity: 0.30; transform: scale(0.70); } 50% { opacity: 0.95; transform: scale(1.25); } }
    @keyframes pulse-b { 0%,100% { opacity: 0.50; transform: scale(0.80); } 50% { opacity: 1.00; transform: scale(1.15); } }
    @keyframes pulse-c { 0%,100% { opacity: 0.20; transform: scale(0.60); } 60% { opacity: 0.80; transform: scale(1.10); } }
    @keyframes pulse-d { 0%,100% { opacity: 0.40; transform: scale(0.85); } 40% { opacity: 1.00; transform: scale(1.20); } }
    @keyframes pulse-e { 0%,100% { opacity: 0.25; transform: scale(0.70); } 50% { opacity: 0.70; transform: scale(1.00); } }
  </style>
  <g fill="#7FDBFF">
    <!-- 外环 12 点 -->
    <circle class="a" cx="44"    cy="24"    r="2.4" style="animation-delay: 0s"/>
    <circle class="b" cx="40.14"  cy="34"    r="2.4" style="animation-delay: .3s"/>
    <circle class="c" cx="32"     cy="40.14" r="2.4" style="animation-delay: .7s"/>
    <circle class="d" cx="22"     cy="42"    r="2.4" style="animation-delay: 1s"/>
    <circle class="e" cx="13.86"  cy="40.14" r="2.4" style="animation-delay: .5s"/>
    <circle class="a" cx="7.86"   cy="34"    r="2.4" style="animation-delay: 1.3s"/>
    <circle class="b" cx="4"      cy="24"    r="2.4" style="animation-delay: .2s"/>
    <circle class="c" cx="7.86"   cy="14"    r="2.4" style="animation-delay: .9s"/>
    <circle class="d" cx="13.86"  cy="7.86"  r="2.4" style="animation-delay: 1.5s"/>
    <circle class="e" cx="22"     cy="6"     r="2.4" style="animation-delay: .4s"/>
    <circle class="a" cx="32"     cy="7.86"  r="2.4" style="animation-delay: 1.1s"/>
    <circle class="b" cx="40.14"  cy="14"    r="2.4" style="animation-delay: .6s"/>
    <!-- 中环 6 点 -->
    <circle class="d" cx="36"     cy="24"    r="2.6" style="animation-delay: .1s"/>
    <circle class="c" cx="30"     cy="34.39" r="2.6" style="animation-delay: .8s"/>
    <circle class="a" cx="18"     cy="34.39" r="2.6" style="animation-delay: 1.4s"/>
    <circle class="b" cx="12"     cy="24"    r="2.6" style="animation-delay: .5s"/>
    <circle class="e" cx="18"     cy="13.61" r="2.6" style="animation-delay: 1.2s"/>
    <circle class="d" cx="30"     cy="13.61" r="2.6" style="animation-delay: .3s"/>
    <!-- 中心 1 点 -->
    <circle class="a" cx="24"     cy="24"    r="3.2" style="animation-delay: .7s"/>
  </g>
</svg>
